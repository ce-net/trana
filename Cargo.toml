[workspace]
resolver = "2"
members = [
    "crates/trana-core",
    "crates/trana-node",
    "crates/trana-sdk",
    "crates/trana-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/ce-net/trana"
authors = ["Leif Rydenfalk <ledamecrydenfalk@gmail.com>"]

[workspace.dependencies]
# Local CE SDK (mesh request/reply + content-addressed blobs + atlas/history).
ce-rs = { path = "../ce-rs", features = ["serve", "locate"] }

# Pure, WASM-clean deps used by trana-core (no tokio/reqwest/libp2p).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
bincode = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }

# Runtime/CLI deps used by the node + tools.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "fs", "io-util", "sync"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
async-trait = "0.1"
