# trana-node — ce-appmgr (`ce app`) package manifest.
#
# This is the ONE deploy path for the trana backend. `ce app` resolves this manifest, fetches +
# verifies the content-addressed binary from any blob holder on the mesh, supervises it (restart on
# failure), and registers the live instance in ce-hub. trana-node needs only loopback access to the
# local CE node's HTTP API (:8844) — it reaches the mesh through that node, never directly — so the
# sandbox is loopback-scoped.
#
# Deploy in two steps (publish once, then install anywhere — your laptop, the relay, your whole fleet):
#
#   ./deploy/publish.sh                                          # build + hash + upload + sign + publish
#   ce app install trana-node --on fleet=mine --yes              # 1 command, every paired device
#   ce app daemon enable trana-node                              # supervise it (serves trana/* forever)
#
# Browsers do NOT run this binary; a web frontend reaches a live trana-node over the mesh with the
# @ce-net/trana TS SDK (`new Trana({ node: "/ce" })`). See deploy/README.md.

[app]
name = "trana-node"
version = "0.1.0"
summary = "trana — distributed social/content + trust backend (mesh service)"
runtime = "native"
publisher = "c0be11e0ce0aaa769da6f9970244947d3d32a0c0d8302fb5f41f73d7950be456"

[native]
bin = "trana-node"
# Content-addressed binaries, one sha256 per host target; ce-appmgr's host_target() selects the right
# one on each device. These lines are (re)generated by deploy/publish.sh after it builds + uploads
# each binary — do not edit them by hand. An empty block is valid: `ce app install ./deploy/...` from
# a working tree uses the on-disk binary, while a registry install requires the published digests.
# AUTO-ARTIFACTS-START
# (run ./deploy/publish.sh to populate)
# AUTO-ARTIFACTS-END

[sandbox]
# Native host process (no runc/gVisor on a dev box); the explicit `none` is audited. trana-node
# reaches the CE node on loopback :8844 and nothing else, so the network scope is loopback.
tier = "none"
net = "loopback"
capability = "inherit"

[daemon]
# trana-node is a long-running mesh service: it serves trana/* RPCs, gossip-replicates records, and
# stays discoverable on the DHT. The single `ce` daemon supervisor keeps it alive; turn supervision
# on per host with `ce app daemon enable trana-node`. No args: the binary serves by default.
enabled = true
restart = "on-failure"
